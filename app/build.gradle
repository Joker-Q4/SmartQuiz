plugins {
    id 'com.android.application'
}

android {

    buildFeatures {
        buildConfig true
    }
    namespace 'com.joker.smartquiz'
    compileSdk 37

    defaultConfig {
        applicationId "com.joker.smartquiz"
        minSdk 26
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    packagingOptions {
        exclude 'META-INF/INDEX.LIST'
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        debug {
            storeFile file("sign.keystore")
            storePassword "android"
            keyAlias "key0"
            keyPassword "android"
        }
        release {
            storeFile file("sign.keystore")
            storePassword "android"
            keyAlias "key0"
            keyPassword "android"
        }
    }
}

dependencies {

    implementation('androidx.core:core-ktx:1.19.0') {
        exclude module: 'support-v4'
    }

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'

    implementation 'com.github.Krosxx:Android-Auto-Api:4.2.3'

    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'

    implementation 'com.github.li-xiaojun:XPopup:v2.2.23'
    implementation 'org.apache.poi:poi:5.5.1'      // Excel (.xls) 解析
    implementation 'org.apache.poi:poi-ooxml:5.5.1' // Excel (.xlsx) 解析

    implementation "cn.hutool:hutool-extra:5.8.47"
    implementation "com.janeluo:ikanalyzer:2012_u6"
    //字体图标
    implementation('com.joanzapata.iconify:android-iconify-fontawesome:2.2.2') {
        exclude group: 'com.android.support', module: 'support-v4'
    }
    implementation('com.joanzapata.iconify:android-iconify-ionicons:2.2.2') {
        exclude group: 'com.android.support', module: 'support-v4'
    }

    implementation "org.apache.commons:commons-text:1.15.0"
    implementation "org.apache.commons:commons-csv:1.14.1"

    //room
    implementation "androidx.room:room-runtime:2.8.4"
    annotationProcessor "androidx.room:room-compiler:2.8.4"


    implementation 'com.github.getActivity:XXPermissions:28.3'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

}